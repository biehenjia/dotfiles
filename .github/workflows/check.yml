name: check

on:
  push:
  pull_request:

jobs:
  nu-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hustcer/setup-nu@v3
        with:
          version: "*"
      - name: nu-check every nushell script
        run: |
          # config.nu / the rest of the repo hardcode ~/dotfiles as the clone
          # location (see nushell/config.nu `use` lines, templates/.envrc). Put
          # the checkout there so parse-time `use` resolution matches reality.
          ln -sfn "$GITHUB_WORKSPACE" "$HOME/dotfiles"
          for f in "$HOME"/dotfiles/nushell/*.nu; do
            echo "== $f =="
            nu -c "nu-check --debug '$f'"
          done

  plist-lint:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: plutil -lint LaunchAgents
        run: plutil -lint launchd/*.plist

  flake-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - name: nix flake check (templates)
        run: |
          nix flake check --all-systems .
          nix flake check --all-systems ./templates/devshell
