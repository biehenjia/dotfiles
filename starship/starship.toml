"$schema" = 'https://starship.rs/config-schema.json'

# Pastel "earthy tree" palette (soft bark + sage + moss)
# light -> deeper earthy accents:
# #fbf7f0  (base cream)
# #f1e9dc  (overlay sand)
# #e7e1d5  (mushroom)
# #cfe1d6  (pale sage)
# #a9c6b2  (sage)
# #6e9c7a  (moss)
# #3f6b4f  (pine)
# #3a3f35  (deep bark text)

format = """
[░▒▓](#a9c6b2)\
[  ](bg:#e7e1d5 fg:#3a3f35)\
[](bg:#a9c6b2 fg:#e7e1d5)\
$directory\
[](fg:#a9c6b2 bg:#6e9c7a)\
$git_branch\
$git_status\
[](fg:#6e9c7a bg:#3f6b4f)\
$nix_shell\
$nodejs\
$rust\
$golang\
$php\
[](fg:#3f6b4f bg:#f1e9dc)\
$time\
[ ](fg:#f1e9dc)\
\n$character"""


[directory]
style = "fg:#3a3f35 bg:#a9c6b2"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "

[git_branch]
symbol = ""
style = "bg:#6e9c7a"
format = '[[ $symbol $branch ](fg:#fbf7f0 bg:#6e9c7a)]($style)'

[git_status]
style = "bg:#6e9c7a"
format = '[[($all_status$ahead_behind )](fg:#fbf7f0 bg:#6e9c7a)]($style)'

# Shown whenever IN_NIX_SHELL is set — i.e. inside a `proj` devshell / any
# `nix develop`. Icon only: every devshell here comes from the same template,
# so $state ("impure") and $name ("nix-shell-env") would just be noise.
[nix_shell]
disabled = false
symbol = ""
format = '[[ $symbol ](fg:#fbf7f0 bg:#3f6b4f)]($style)'
style = "bg:#3f6b4f"

[nodejs]
symbol = ""
style = "bg:#3f6b4f"
format = '[[ $symbol ($version) ](fg:#fbf7f0 bg:#3f6b4f)]($style)'

[rust]
symbol = ""
style = "bg:#3f6b4f"
format = '[[ $symbol ($version) ](fg:#fbf7f0 bg:#3f6b4f)]($style)'

[golang]
symbol = ""
style = "bg:#3f6b4f"
format = '[[ $symbol ($version) ](fg:#fbf7f0 bg:#3f6b4f)]($style)'

[php]
symbol = ""
style = "bg:#3f6b4f"
format = '[[ $symbol ($version) ](fg:#fbf7f0 bg:#3f6b4f)]($style)'

[time]
disabled = false
time_format = "%R" # Hour:Minute Format
style = "bg:#f1e9dc"
format = '[[  $time ](fg:#3f6b4f bg:#f1e9dc)]($style)'
