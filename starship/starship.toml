"$schema" = 'https://starship.rs/config-schema.json'

# Pastel "earthy tree" palette (soft bark + sage + moss)
# light -> deeper earthy accents:
# #fbf7f0  (base cream)
# #f1e9dc  (overlay sand)
# #e7e1d5  (mushroom)
# #cfe1d6  (pale sage)
# #a9c6b2  (sage)
# #6e9c7a  (moss)
# #3f6b4f  (pine)
# #3a3f35  (deep bark text)

format = """
[░▒▓](#a9c6b2)\
[  ](bg:#e7e1d5 fg:#3a3f35)\
[](bg:#a9c6b2 fg:#e7e1d5)\
$directory\
[](fg:#a9c6b2 bg:#6e9c7a)\
$git_branch\
$git_status\
[](fg:#6e9c7a bg:#3f6b4f)\
$nix_shell\
$nodejs\
$rust\
$golang\
$php\
$python\
$c\
$cpp\
[](fg:#3f6b4f bg:#f1e9dc)\
$time\
[ ](fg:#f1e9dc)\
\n$character"""

# Right prompt — rendered on the last line (nushell/starship.nu sets
# render_right_prompt_on_last_line + PROMPT_COMMAND_RIGHT). No powerline caps
# here: just dim earthy text trailing the command you actually ran. Without a
# right_format these modules would sit unused — cmd_duration in particular is
# already computed (starship.nu passes --cmd-duration) and otherwise discarded.
right_format = """
$cmd_duration\
$git_state\
$git_metrics\
$jobs"""


[directory]
style = "fg:#3a3f35 bg:#a9c6b2"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "

[git_branch]
symbol = ""
style = "bg:#6e9c7a"
format = '[[ $symbol $branch ](fg:#fbf7f0 bg:#6e9c7a)]($style)'

[git_status]
style = "bg:#6e9c7a"
format = '[[($all_status$ahead_behind )](fg:#fbf7f0 bg:#6e9c7a)]($style)'

# Shown whenever IN_NIX_SHELL is set — i.e. inside a `xin` devshell / any
# `nix develop`. Icon only: every devshell here comes from the same template,
# so $state ("impure") and $name ("nix-shell-env") would just be noise.
[nix_shell]
disabled = false
symbol = ""
format = '[[ $symbol ](fg:#fbf7f0 bg:#3f6b4f)]($style)'
style = "bg:#3f6b4f"

[nodejs]
symbol = ""
style = "bg:#3f6b4f"
format = '[[ $symbol ($version) ](fg:#fbf7f0 bg:#3f6b4f)]($style)'

[rust]
symbol = ""
style = "bg:#3f6b4f"
format = '[[ $symbol ($version) ](fg:#fbf7f0 bg:#3f6b4f)]($style)'

[golang]
symbol = ""
style = "bg:#3f6b4f"
format = '[[ $symbol ($version) ](fg:#fbf7f0 bg:#3f6b4f)]($style)'

[php]
symbol = ""
style = "bg:#3f6b4f"
format = '[[ $symbol ($version) ](fg:#fbf7f0 bg:#3f6b4f)]($style)'

[python]
symbol = ""
style = "bg:#3f6b4f"
# Trailing venv name when one is active, e.g.  3.12.2 (.venv)
format = '[[ $symbol ($version)( \($virtualenv\)) ](fg:#fbf7f0 bg:#3f6b4f)]($style)'

# [c] fires on .c/.h files, [cpp] on .cpp/.cc/.cxx/.hpp/… — they detect
# independently, so a mixed tree can show both segments. $name is the detected
# compiler (clang / gcc); keep it since which one is in play actually matters.
[c]
symbol = ""
style = "bg:#3f6b4f"
format = '[[ $symbol ($version(-$name) ) ](fg:#fbf7f0 bg:#3f6b4f)]($style)'

# Disabled by default in Starship, so it must be turned on explicitly.
[cpp]
disabled = false
symbol = "C++ "
style = "bg:#3f6b4f"
format = '[[ $symbol ($version(-$name) ) ](fg:#fbf7f0 bg:#3f6b4f)]($style)'

[time]
disabled = false
time_format = "%R" # Hour:Minute Format
style = "bg:#f1e9dc"
format = '[[  $time ](fg:#3f6b4f bg:#f1e9dc)]($style)'


# ── right prompt ───────────────────────────────────────
# Plain dim moss text, no powerline caps — a quiet trailer on the last line.

# How long the last command took; hidden under min_time so fast commands stay
# silent. (starship.nu already passes --cmd-duration; nothing consumed it before.)
[cmd_duration]
min_time = 500
format = '[ 󰔛 $duration]($style)'
style = "fg:#6e9c7a"

# Mid-operation git state: rebase / merge / cherry-pick in progress, with step
# counter. Terracotta so it reads as "you are not on solid ground".
[git_state]
format = '[ $state( $progress_current/$progress_total)]($style)'
style = "fg:#b5793f"

# Lines added/removed in the working tree — persistent while the tree is dirty,
# so it fills the right prompt when cmd_duration/git_state/jobs are all quiet.
# Complements the left [git_status], which counts changed *files*, not lines.
# Runs `git diff --shortstat` per prompt: cheap, but it is a subprocess.
[git_metrics]
disabled = false
format = '[ +$added]($added_style)[ -$deleted]($deleted_style)'
added_style = "fg:#6e9c7a"
deleted_style = "fg:#b5793f"

# Background jobs (starship.nu passes --jobs).
[jobs]
symbol = " "
number_threshold = 1
format = '[ $symbol$number]($style)'
style = "fg:#6e9c7a"
